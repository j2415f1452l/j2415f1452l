name: Generate Github Readme Stats
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download stats.svg
        run: |
          curl -L "https://github-readme-stats.ljf1122.workers.dev/api?username=j2415f1452I&show_icons=true&theme=radical" -o stats.svg
          curl -L "https://github-readme-stats.ljf1122.workers.dev/api/top-langs?username=j2415f1452I&layout=compact&theme=radical" -o top-langs.svg

      - name: Commit & Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git commit -m "auto update stats svg" || echo "no changes"
          git push
