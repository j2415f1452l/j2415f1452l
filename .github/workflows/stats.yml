name: Generate Github Readme Stats
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clone github-readme-stats
        run: git clone https://github.com/anuraghazra/github-readme-stats.git
      - name: Install dependencies
        run: cd github-readme-stats && npm install
      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd github-readme-stats
          node scripts/generate-stats.js --username j2415f1452I --theme tokyonight --show_icons true --output ../stats.svg
          node scripts/generate-top-langs.js --username j2415f1452I --theme tokyonight --layout compact --output ../top-langs.svg
      - name: Commit & Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git commit -m "auto update stats cards" || echo "No changes"
          git push
